<!DOCTYPE html>
<html>

<head>

<title>Spam Detection</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
padding:0;
}

.container{
width:600px;
margin:60px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

h1{
text-align:center;
color:#2c3e50;
}

textarea{
width:100%;
height:150px;
padding:10px;
font-size:18px;
border-radius:8px;
}

button{
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
background:#3498db;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

.result{
margin-top:20px;
padding:15px;
font-size:22px;
text-align:center;
font-weight:bold;
border-radius:10px;
background:#ecf0f1;
}

#count{
margin-top:10px;
color:gray;
}

</style>

</head>

<body>

<div class="container">

<h1>Spam Message Detector</h1>

<form action="/predict" method="POST">

<textarea
name="message"
id="message"
placeholder="Enter your message..."
onkeyup="countCharacters()">{{message if message else ''}}</textarea>

<div id="count">
Characters : 0
</div>

<button type="submit">
Predict
</button>

</form>

{% if prediction %}

<div class="result">
{{prediction}}
</div>

{% endif %}

</div>

<script>

function countCharacters(){

let text=document.getElementById("message").value;

document.getElementById("count").innerHTML=
"Characters : "+text.length;

}

window.onload=countCharacters;

</script>

</body>

</html>
